document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

gs:'liga' 0; -webkit-font-smoothing:antialiased; }\n  [dir=\"rtl\"], [style*=\"direction:rtl\"] { letter-spacing:0; }\n  a { color: oklch(0.7 0.13 55); text-decoration:none; }\n  a:hover { color: oklch(0.78 0.13 60); }\n  input { font-family:inherit; letter-spacing:inherit; }\n  input:focus { outline:none; }\n  ::-webkit-scrollbar { width:0; height:0; display:none; }\n  * { scrollbar-width: none; -ms-overflow-style: none; }\n  @keyframes wd-spin { to { transform: rotate(360deg); } }\n  @keyframes wd-pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }\n  @keyframes wd-sheet { from { transform: translateY(14px); opacity:0; } to { transform: translateY(0); opacity:1; } }\n  @keyframes wd-lift { from { transform: scale(0.97); opacity:0; } to { transform: scale(1); opacity:1; } }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<section style=\"min-height:100vh; padding:60px 56px 100px; display:flex; gap:56px; align-items:flex-start; flex-wrap:wrap;\">\n\n  <div style=\"width:440px; flex-shrink:0;\">\n    <div style=\"display:inline-flex; align-items:center; gap:8px; padding:6px 13px; border-radius:9999px; border:1px solid oklch(1 0 0 / 0.14); background:oklch(1 0 0 / 0.03); font-size:13px; color:oklch(0.82 0.02 75);\">\n      <span style=\"width:16px;height:6px;border-radius:9999px;background:linear-gradient(90deg, oklch(0.83 0.145 74), oklch(0.62 0.19 38));\"><\u002Fspan>\n      Projects drawer\n    <\u002Fdiv>\n    <h1 style=\"font-size:42px; line-height:1.06; letter-spacing:-1.2px; margin:20px 0 0; font-weight:500; color:oklch(0.97 0.005 85);\">Filter, recognise, act<\u002Fh1>\n    <p style=\"margin:14px 0 0; font-size:17.5px; line-height:1.5; letter-spacing:-0.4px; color:oklch(0.75 0.015 75); text-wrap:pretty;\">Every row carries a preview of its last build, so five projects called \"Beauty Product Website Clone\" stop being interchangeable. Chips narrow the list before you scroll it, and inside a filter the projects fall into time groups. Nothing sits on the row competing with the tap that opens it — press and hold to lift a project out and act on it.<\u002Fp>\n\n    <div style=\"display:flex; flex-direction:column; gap:22px; margin-top:34px;\">\n      <div style=\"display:flex; gap:14px;\">\n        <span style=\"width:26px; height:26px; flex-shrink:0; border-radius:8px; background:oklch(1 0 0 / 0.06); border:1px solid oklch(1 0 0 / 0.1); display:grid; place-items:center; font-family:'Geist Mono',monospace; font-size:11px; color:oklch(0.85 0.02 75);\">1<\u002Fspan>\n        <span>\n          <span style=\"display:block; font-size:15.5px; font-weight:500; color:oklch(0.94 0.008 80);\">Scrolling forever<\u002Fspan>\n          <span style=\"display:block; margin-top:4px; font-size:14.5px; line-height:1.45; color:oklch(0.72 0.015 75);\">All · Building · Live · Drafts with counts, then Today / This week / Earlier inside the result. Search filters the same list in place.<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex; gap:14px;\">\n        <span style=\"width:26px; height:26px; flex-shrink:0; border-radius:8px; background:oklch(1 0 0 / 0.06); border:1px solid oklch(1 0 0 / 0.1); display:grid; place-items:center; font-family:'Geist Mono',monospace; font-size:11px; color:oklch(0.85 0.02 75);\">2<\u002Fspan>\n        <span>\n          <span style=\"display:block; font-size:15.5px; font-weight:500; color:oklch(0.94 0.008 80);\">No rename / duplicate / delete<\u002Fspan>\n          <span style=\"display:block; margin-top:4px; font-size:14.5px; line-height:1.45; color:oklch(0.72 0.015 75);\">Press and hold any row. The project lifts onto a card and the sheet rises under it — no ⋯ target to fight the tap.<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex; gap:14px;\">\n        <span style=\"width:26px; height:26px; flex-shrink:0; border-radius:8px; background:oklch(1 0 0 / 0.06); border:1px solid oklch(1 0 0 / 0.1); display:grid; place-items:center; font-family:'Geist Mono',monospace; font-size:11px; color:oklch(0.85 0.02 75);\">3<\u002Fspan>\n        <span>\n          <span style=\"display:block; font-size:15.5px; font-weight:500; color:oklch(0.94 0.008 80);\">Nothing says it is still generating<\u002Fspan>\n          <span style=\"display:block; margin-top:4px; font-size:14.5px; line-height:1.45; color:oklch(0.72 0.015 75);\">A Building chip that pulses while work is queued, and the row shows which section is being written.<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex; gap:14px;\">\n        <span style=\"width:26px; height:26px; flex-shrink:0; border-radius:8px; background:oklch(1 0 0 / 0.06); border:1px solid oklch(1 0 0 / 0.1); display:grid; place-items:center; font-family:'Geist Mono',monospace; font-size:11px; color:oklch(0.85 0.02 75);\">4<\u002Fspan>\n        <span>\n          <span style=\"display:block; font-size:15.5px; font-weight:500; color:oklch(0.94 0.008 80);\">Language, from the bottom<\u002Fspan>\n          <span style=\"display:block; margin-top:4px; font-size:14.5px; line-height:1.45; color:oklch(0.72 0.015 75);\">The avatar opens the account sheet; Language sits at the top of it with the current one spelled out. The picker shows each language in its own script with a direction tag, and picking العربية flips the whole drawer to RTL — it opens from the right edge.<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:36px; padding:16px 18px; border-radius:16px; border:1px solid oklch(1 0 0 / 0.1); background:oklch(1 0 0 / 0.03);\">\n      <div style=\"font-family:'Geist Mono',monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:oklch(0.62 0.02 72);\">Live prototype<\u002Fdiv>\n      <div style=\"margin-top:8px; font-size:14.5px; line-height:1.5; color:oklch(0.78 0.015 75);\">Tap the chips, type in search, press and hold a row for a second. Then tap the avatar at the bottom and switch the language — everything retranslates, and Arabic mirrors the layout.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-screen-label=\"Drawer\" style=\"flex-shrink:0;\">\n    <div style=\"position:relative; padding:13px; border-radius:58px; background:#0a0a0c; box-shadow:0 44px 90px -30px rgba(0,0,0,0.62), inset 0 0 0 2px #2a2a2e;\">\n      <div style=\"position:relative; width:380px; height:822px; border-radius:46px; overflow:hidden; background:#f7f4ed;\">\n\n        <div style=\"position:absolute; inset:0; padding:74px 20px 20px; display:flex; flex-direction:column; gap:14px;\">\n          <div style=\"height:15px; width:70%; border-radius:9999px; background:oklch(0.24 0.012 55 / 0.12);\"><\u002Fdiv>\n          <div style=\"height:15px; width:52%; border-radius:9999px; background:oklch(0.24 0.012 55 / 0.09);\"><\u002Fdiv>\n          <div style=\"height:120px; border-radius:16px; background:oklch(0.24 0.012 55 / 0.07);\"><\u002Fdiv>\n          <div style=\"margin-top:auto; height:56px; border-radius:9999px; background:oklch(0.24 0.012 55 / 0.07);\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"position:absolute; inset:0; background:oklch(0.3 0.02 55 / 0.3); backdrop-filter:blur(1.5px);\"><\u002Fdiv>\n\n        <div style=\"{{ drawerStyle }}\">\n\n          <div style=\"height:52px; flex-shrink:0; display:flex; align-items:center; direction:ltr; padding-left:30px;\">\n            <span style=\"font-size:16.5px; font-weight:600; color:oklch(0.24 0.012 55); font-variant-numeric:tabular-nums;\">9:41<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"flex-shrink:0; display:flex; align-items:center; gap:8px; padding:2px 14px 0;\">\n            <div style=\"flex:1; min-width:0; height:44px; display:flex; align-items:center; gap:9px; padding:0 14px; border-radius:9999px; border:1px solid #eceae4; background:#f7f4ed;\">\n              <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" style=\"flex-shrink:0;\"><circle cx=\"11\" cy=\"11\" r=\"6.4\" stroke=\"oklch(0.5 0.015 60)\" stroke-width=\"1.8\"><\u002Fcircle><path d=\"m16 16 4 4\" stroke=\"oklch(0.5 0.015 60)\" stroke-width=\"1.8\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n              <input type=\"text\" placeholder=\"{{ t.search }}\" value=\"{{ query }}\" sc-camel-on-change=\"{{ onQuery }}\" style=\"flex:1; min-width:0; border:none; background:transparent; font-size:14px; color:oklch(0.24 0.012 55);\">\n              <sc-if value=\"{{ hasQuery }}\">\n                <span sc-camel-on-click=\"{{ clearQuery }}\" style=\"width:20px; height:20px; flex-shrink:0; border-radius:9999px; background:oklch(0.5 0.015 60 / 0.16); display:grid; place-items:center; cursor:pointer;\">\n                  <svg width=\"11\" height=\"11\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M6 6l12 12M18 6 6 18\" stroke=\"oklch(0.35 0.012 55)\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n                <\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <span sc-camel-on-click=\"{{ noop }}\" style=\"width:44px; height:44px; flex-shrink:0; border-radius:9999px; background:oklch(0.62 0.16 45); display:grid; place-items:center; box-shadow:0 7px 16px -8px oklch(0.62 0.16 45 / 0.8); cursor:pointer;\" style-active=\"transform:scale(0.94)\">\n              <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M12 5.5v13M5.5 12h13\" stroke=\"#fcfbf8\" stroke-width=\"2.2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n            <\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"flex-shrink:0; display:flex; gap:5px; padding:13px 14px 11px; overflow-x:auto;\">\n            <sc-for list=\"{{ chips }}\" as=\"chip\" hint-placeholder-count=\"4\">\n              <span sc-camel-on-click=\"{{ chip.onClick }}\" style=\"{{ chip.style }}\">\n                <sc-if value=\"{{ chip.dot }}\"><span style=\"width:5px;height:5px;border-radius:9999px;background:oklch(0.62 0.16 45); animation:wd-pulse 1.6s ease-in-out infinite;\"><\u002Fspan><\u002Fsc-if>\n                <span>{{ chip.label }}<\u002Fspan>\n                <sc-if value=\"{{ chip.count }}\"><span style=\"{{ chip.countStyle }}\">{{ chip.count }}<\u002Fspan><\u002Fsc-if>\n              <\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"flex:1; min-height:0; overflow-y:auto; padding:0 14px 8px;\">\n            <sc-for list=\"{{ groups }}\" as=\"group\" hint-placeholder-count=\"2\">\n              <div>\n                <div style=\"display:flex; align-items:center; gap:8px; padding:8px 0;\">\n                  <span style=\"font-family:'Geist Mono',monospace; font-size:9.5px; letter-spacing:0.13em; text-transform:uppercase; color:oklch(0.5 0.015 60); white-space:nowrap;\">{{ group.label }}<\u002Fspan>\n                  <span style=\"flex:1; height:1px; background:#eceae4;\"><\u002Fspan>\n                <\u002Fdiv>\n                <sc-for list=\"{{ group.items }}\" as=\"p\" hint-placeholder-count=\"3\">\n                  <div sc-camel-on-pointer-down=\"{{ p.onDown }}\" sc-camel-on-pointer-up=\"{{ p.onUp }}\" sc-camel-on-pointer-leave=\"{{ p.onUp }}\" sc-camel-on-context-menu=\"{{ p.onMenu }}\" style=\"{{ p.rowStyle }}\">\n                    <span style=\"{{ p.thumbStyle }}\">\n                      <span style=\"{{ p.thumbWashStyle }}\"><\u002Fspan>\n                      <sc-if value=\"{{ p.building }}\">\n                        <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" style=\"animation:wd-spin 1s linear infinite; position:relative;\"><circle cx=\"12\" cy=\"12\" r=\"8\" stroke=\"oklch(0.84 0.14 75 / 0.25)\" stroke-width=\"2.6\"><\u002Fcircle><path d=\"M12 4a8 8 0 0 1 8 8\" stroke=\"oklch(0.84 0.14 75)\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n                      <\u002Fsc-if>\n                      <sc-if value=\"{{ p.notBuilding }}\">\n 2Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n\n            <sc-if value=\"{{ noResults }}\">\n              <div style=\"padding:56px 18px; text-align:center;\">\n                <div style=\"width:46px; height:46px; margin:0 auto; border-radius:14px; background:#f7f4ed; border:1px solid #eceae4; display:grid; place-items:center;\">\n                  <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><circle cx=\"11\" cy=\"11\" r=\"6.4\" stroke=\"oklch(0.5 0.015 60)\" stroke-width=\"1.8\"><\u002Fcircle><path d=\"m16 16 4 4\" stroke=\"oklch(0.5 0.015 60)\" stroke-width=\"1.8\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n                <\u002Fdiv>\n                <div style=\"margin-top:14px; font-size:15px; font-weight:500; color:oklch(0.24 0.012 55);\">{{ t.noMatch }}<\u002Fdiv>\n                <div style=\"margin-top:5px; font-size:13.5px; line-height:1.45; color:oklch(0.5 0.015 60);\">{{ emptyHint }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"flex-shrink:0; display:flex; align-items:center; gap:10px; padding:8px 14px 16px; border-top:1px solid #eceae4; background:#fcfbf8;\">\n            <div style=\"flex:1; min-width:0; height:46px; display:flex; align-items:center; gap:10px; padding:0 14px 0 5px; border-radius:9999px; border:1px solid #eceae4; background:#f7f4ed;\">\n              <span style=\"width:34px; height:34px; border-radius:9999px; background:oklch(0.62 0.16 45 / 0.14); display:grid; place-items:center;\">\n                <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M12 3.5 13.9 9l5.6 1.7-4.2 4 .6 5.8L12 17.9l-3.9 2.6.6-5.8-4.2-4L10.1 9 12 3.5Z\" stroke=\"oklch(0.62 0.16 45)\" stroke-width=\"1.7\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n              <\u002Fspan>\n              <span style=\"flex:1; font-size:14px; font-weight:500; color:oklch(0.24 0.012 55);\">My Wandit<\u002Fspan>\n              <svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"m6 9 6 6 6-6\" stroke=\"oklch(0.5 0.015 60)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n            <span sc-camel-on-click=\"{{ openAccount }}\" style=\"width:42px; height:42px; flex-shrink:0; border-radius:9999px; background:linear-gradient(135deg, oklch(0.8 0.15 70), oklch(0.66 0.19 35)); display:grid; place-items:center; font-size:15px; font-weight:700; color:#fff; cursor:pointer;\" style-active=\"transform:scale(0.94)\">Z<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ overlayOpen }}\">\n          <div sc-camel-on-click=\"{{ closeSheet }}\" style=\"position:absolute; inset:0; background:oklch(0.28 0.02 55 / 0.46); backdrop-filter:blur(2px);\"><\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ sheetOpen }}\">\n          <div style=\"{{ sheetStyle }}\">\n            <div style=\"display:flex; align-items:center; gap:12px; padding:10px 12px; margin-bottom:10px; border-radius:16px; background:#fcfbf8; box-shadow:0 26px 50px -18px rgba(0,0,0,0.45); animation:wd-lift 0.22s cubic-bezier(0.32,0.72,0,1) both;\">\n              <span style=\"{{ activeThumbStyle }}\"><span style=\"{{ activeWashStyle }}\"><\u002Fspan>\n                <span style=\"position:absolute; left:6px; top:9px; width:24px; height:4px; border-radius:9999px; background:oklch(0.96 0.02 80 / 0.7);\"><\u002Fspan>\n                <span style=\"position:absolute; left:6px; top:18px; width:32px; height:3px; border-radius:9999px; background:oklch(0.96 0.02 80 / 0.32);\"><\u002Fspan>\n              <\u002Fspan>\n              <span style=\"flex:1; min-width:0;\">\n                <span style=\"display:block; font-size:14.5px; font-weight:600; color:oklch(0.24 0.012 55); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ activeName }}<\u002Fspan>\n
