# Builds the Windows installer of one Wandit desktop app with the Electron engine
# (docs/v2/desktop-apps.md, section 9). The `desktop-build` Trigger task dispatches it through
# the GitHub API with the 4 inputs below, for a project whose desktop engine is `electron`.
# It downloads the server-made input, packs the trusted Electron shell with electron-builder,
# installs the installer on the runner to self-test the migrations, and uploads one NSIS
# installer to a presigned URL. It holds no secret. It reads the repo variable
# DESKTOP_BUILD_BUCKET_URLS (tooling/desktop-builder/README.md of the Wandit repo, Setup step 9).
name: Desktop build (Electron)
run-name: Desktop build Electron ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Id of the desktop_builds row (uuid). Only the run name and the concurrency group use it.
        type: string
        required: true
      input_url:
        description: Presigned R2 GET URL of desktop-temp/<project id>/inputs/<build id>-<random>.tar.gz. It expires after 2 h.
        type: string
        required: true
      input_sha256:
        description: SHA-256 of desktop-input.tar.gz, 64 hex digits.
        type: string
        required: true
      output_url:
        description: Presigned R2 PUT URL of desktop-temp/<project id>/staging/<build id>-<random>.exe. It expires after 2 h.
        type: string
        required: true

# The job reads no repo content and calls no GitHub API, so its token gets no scope.
permissions: {}

# A second dispatch of the same build waits for the first run, so two runs never upload to one URL.
concurrency:
  group: desktop-build-${{ inputs.build_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    # A build with no cache takes about 5 to 10 minutes (ESTIMATE): it compiles nothing.
    # The task polls this run for at most 70 minutes, so the job must stop first.
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      # Keep these 3 values equal in the warm-electron job of warm-cache.yml. The cache key and
      # the cache paths use them.
      # Node.js runs npm and electron-builder only. The app holds the Node.js of Electron.
      NODE_VERSION: "24.22.2"
      # npm reads its cache folder from this name.
      npm_config_cache: 'C:\desktop-build\electron\npm'
      # electron-builder puts its NSIS and resource tools here.
      ELECTRON_BUILDER_CACHE: 'C:\desktop-build\electron\electron-builder'
    steps:
      - name: Mask and check the URLs
        env:
          # The R2 bucket URL of each environment that dispatches here, one per line. Not a secret.
          BUCKET_URLS: ${{ vars.DESKTOP_BUILD_BUCKET_URLS }}
        run: |
          # A step header shows the env of its step. So this step reads the URLs from the
          # event file, and masks them before a later step header can show them.
          $dispatchInputs = (Get-Content -LiteralPath $env:GITHUB_EVENT_PATH -Raw | ConvertFrom-Json).inputs
          foreach ($url in @($dispatchInputs.input_url, $dispatchInputs.output_url)) {
            # A line break ends the mask command early, and the rest of the URL shows.
            if ([string]::IsNullOrEmpty($url) -or $url -match '[\r\n]') {
              throw 'A URL input is empty or holds a line break.'
            }
            Write-Output "::add-mask::$url"
          }
          # Security: a stolen dispatch token must not choose the input, because CI packs its shell folder.
          # Only a presigned URL of a temp key that the API made passes (r2.ts, desktopInputKey and
          # desktopStagingKey). Only the API has the R2 keys that write and sign such a URL.
          if ([string]::IsNullOrWhiteSpace($env:BUCKET_URLS)) {
            throw 'The repo variable DESKTOP_BUILD_BUCKET_URLS is empty. Read tooling/desktop-builder/README.md of the Wandit repo, Setup step 9.'
          }
          $bucketUrls = @(-split $env:BUCKET_URLS)
          foreach ($bucketUrl in $bucketUrls) {
            # The virtual-hosted URL that the S3 client of r2.ts signs. R2 bucket names hold no dot.
            if ($bucketUrl -cnotmatch '^https://[a-z0-9-]+\.[0-9a-f]{32}\.r2\.cloudflarestorage\.com\z') {
              throw "DESKTOP_BUILD_BUCKET_URLS holds '$bucketUrl'. Expected https://<R2_BUCKET>.<R2_ACCOUNT_ID>.r2.cloudflarestorage.com."
            }
          }
          $bucket = '(?:' + (@($bucketUrls | ForEach-Object { [regex]::Escape($_) }) -join '|') + ')'
          $uuid = '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
          # The key is desktop-temp/<project id>/<folder>/<build id>-<32 hex>.<extension>. The SigV4
          # query that follows holds no '/', '#', or '@', so it cannot change the host or the key.
          $tempKey = '^' + $bucket + '/desktop-temp/' + $uuid + '/'
          $query = '\?[A-Za-z0-9%=&._~-]+\z'
          if ($dispatchInputs.input_url -cnotmatch ($tempKey + 'inputs/' + $uuid + '-[0-9a-f]{32}\.tar\.gz' + $query)) {
            throw 'input_url is not a presigned URL of a desktop-temp input key in DESKTOP_BUILD_BUCKET_URLS.'
          }
          if ($dispatchInputs.output_url -cnotmatch ($tempKey + 'staging/' + $uuid + '-[0-9a-f]{32}\.exe' + $query)) {
            throw 'output_url is not a presigned URL of a desktop-temp staging key in DESKTOP_BUILD_BUCKET_URLS.'
          }

      - name: Check, download, and extract the input
        env:
          BUILD_ID: ${{ inputs.build_id }}
          INPUT_URL: ${{ inputs.input_url }}
          INPUT_SHA256: ${{ inputs.input_sha256 }}
        run: |
          # A native command (tar) with a non-zero exit code stops the step.
          $PSNativeCommandUseErrorActionPreference = $true
          # \z, not $: a value with a trailing line break fails the check.
          if ($env:BUILD_ID -notmatch '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\z') {
            throw 'build_id is not a uuid.'
          }
          if ($env:INPUT_SHA256 -notmatch '^[0-9a-f]{64}\z') {
            throw 'input_sha256 is not 64 hex digits.'
          }
          $archive = Join-Path $env:GITHUB_WORKSPACE 'desktop-input.tar.gz'
          # The progress bar makes Invoke-WebRequest much slower.
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri $env:INPUT_URL -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          # -ine ignores case: Get-FileHash answers upper case, the server sends lower case.
          if ($actualSha256 -ine $env:INPUT_SHA256) {
            throw "The input SHA-256 is $actualSha256, not $env:INPUT_SHA256."
          }
          # Windows tar (bsdtar) refuses absolute paths, '..' parts, and a write through a symlink.
          & "$env:SystemRoot\System32\tar.exe" -xzf $archive -C $env:GITHUB_WORKSPACE
          Remove-Item -LiteralPath $archive
          # The input holds 3 folders only. A root .npmrc could make npm use another registry.
          $unexpected = @(Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force -Name | Where-Object { $_ -notin 'shell', 'dist', 'migrations' })
          if ($unexpected.Count -gt 0) {
            throw "The input holds unexpected entries: $($unexpected -join ', ')."
          }

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # The action must not save a cache: only warm-cache.yml writes one.
          package-manager-cache: false

      # Restore only. The warm-electron job of warm-cache.yml on the default branch saves this
      # cache, so a user build never writes one.
      - name: Restore the download cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Keep this list equal in the warm-electron job. The cache version is a hash of these paths.
          # @electron/get puts the Electron zip in its default folder (line 2) and checks its SHA-256.
          # The value is a pin only when the shell config sets electronDownload.checksums.
          path: |
            ${{ env.npm_config_cache }}
            ~\AppData\Local\electron\Cache
            ${{ env.ELECTRON_BUILDER_CACHE }}
          # Exact key only, no restore-keys: a build never takes the cache of another lock file.
          # The lock file pins electron and electron-builder. A miss only adds download time.
          key: desktop-electron-v1-windows-x64-node-${{ env.NODE_VERSION }}-${{ hashFiles('shell/package-lock.json') }}

      - name: Build the installer
        working-directory: shell
        run: |
          # npm and npx are scripts on Windows, so each call needs its own exit code check.
          # npm ci installs the exact versions of package-lock.json and checks each integrity hash.
          # Security: --ignore-scripts stops every install script of a package.
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) {
            throw "npm ci ended with exit code $LASTEXITCODE."
          }
          # --no-install: npx runs only the installed electron-builder, and never downloads a package.
          # Do not write "--no": npx then reads "electron-builder" as the value of that flag and stops.
          # --publish never: electron-builder uploads nothing. The config reads wandit.desktop.json.
          npx --no-install electron-builder --win nsis --x64 --config electron-builder.config.cjs --publish never
          if ($LASTEXITCODE -ne 0) {
            throw "electron-builder ended with exit code $LASTEXITCODE."
          }

      # Section 9: the installed exe runs its packed migrations with the real runner on a new
      # database, before the upload. 3 steps, so a failed install, a missing exe, or a failed
      # uninstall is not a failed self-test.
      - name: Install the app on the runner
        id: install-app
        # The install takes seconds. A hang must not use the 30-minute job.
        timeout-minutes: 5
        run: |
          # The config names the installer and the app exe after mainBinaryName and version. The
          # server checked both, and these checks keep each path inside its folder.
          $configPath = Join-Path $env:GITHUB_WORKSPACE 'shell\wandit.desktop.json'
          $config = Get-Content -LiteralPath $configPath -Raw | ConvertFrom-Json
          $binaryName = $config.mainBinaryName
          if ($binaryName -cnotmatch '^[a-z0-9]+(?:-[a-z0-9]+)*\z') {
            throw 'mainBinaryName in wandit.desktop.json is not a lowercase kebab-case name.'
          }
          if ($config.version -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+\z') {
            throw 'version in wandit.desktop.json is not 3 numbers with dots.'
          }
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'shell\release'
          $installerName = "$binaryName-$($config.version)-setup.exe"
          # The unpacked app is in a subfolder, so the top level holds only the installer exe.
          $installers = @(Get-ChildItem -LiteralPath $releaseDir -Filter '*.exe' -File)
          if ($installers.Count -ne 1 -or $installers[0].Name -cne $installerName) {
            throw "Expected only $installerName in $releaseDir, found: $($installers.Name -join ', ')."
          }
          # perMachine is false, so the install needs no admin rights. /S is the NSIS silent mode.
          # /D sets the folder: it must come last, without quotes. Without --force-run, no app starts.
          $installDir = Join-Path $env:LOCALAPPDATA 'wandit-self-test-install'
          $install = Start-Process -FilePath $installers[0].FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "The installer ended with exit code $($install.ExitCode)."
          }
          $appExe = Join-Path $installDir "$binaryName.exe"
          # A missing exe is a platform fault, so it fails this step, not the self-test.
          if (-not (Test-Path -LiteralPath $appExe -PathType Leaf)) {
            throw "The installer wrote no $appExe."
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "app-exe=$appExe"
          # The upload step sends this counted file.
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "installer-path=$($installers[0].FullName)"

      # The task reads the conclusion of this step by its name, through the GitHub jobs API.
      # A failure stores `self_test_failed`, any other failure `ci_failed`. Keep the name equal to
      # SELF_TEST_STEP in apps/server/src/modules/app-builder/infrastructure/desktop/github-desktop-build-runner.ts
      # of the Wandit repo, and equal to the step of build.yml.
      - name: Self-test the installed app
        # The test takes seconds. A hang must not use the 30-minute job.
        timeout-minutes: 5
        env:
          # The install step checked that this exe exists in the install folder.
          APP_EXE: ${{ steps.install-app.outputs.app-exe }}
        run: |
          $outFile = Join-Path $env:RUNNER_TEMP 'self-test-out.txt'
          $errFile = Join-Path $env:RUNNER_TEMP 'self-test-err.txt'
          # An Electron exe has no console window, so its output goes to files.
          $selfTest = Start-Process -FilePath $env:APP_EXE -ArgumentList '--wandit-self-test' -Wait -PassThru -RedirectStandardOutput $outFile -RedirectStandardError $errFile
          # Security: the result line can hold the SQL of the user. The runner reads no command in it.
          $stopToken = [guid]::NewGuid().ToString('N')
          Write-Output "::stop-commands::${stopToken}"
          Get-Content -LiteralPath $outFile, $errFile
          Write-Output "::${stopToken}::"
          if ($selfTest.ExitCode -ne 0) {
            throw "The self-test ended with exit code $($selfTest.ExitCode). Read the wandit-self-test line above."
          }
          # Exit code 0 alone is not a pass: an Electron exe that ignores the argument can also exit with 0.
          if (@(Get-Content -LiteralPath $outFile | Where-Object { $_ -cmatch '^wandit-self-test: ok' }).Count -ne 1) {
            throw 'The self-test printed no "wandit-self-test: ok" line.'
          }

      - name: Uninstall the app
        # Also after a failed self-test, so the uninstaller is tested on each install. The upload
        # still runs only when every step before it passed.
        if: ${{ !cancelled() && steps.install-app.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          # The same folder as the /D value of the install step.
          $installDir = Join-Path $env:LOCALAPPDATA 'wandit-self-test-install'
          # electron-builder names the uninstaller "Uninstall <name>.exe", so a pattern finds it.
          $uninstallers = @(Get-ChildItem -LiteralPath $installDir -Filter 'Uninstall *.exe' -File)
          if ($uninstallers.Count -ne 1) {
            throw "Expected 1 uninstaller in $installDir, found $($uninstallers.Count)."
          }
          # _?= makes the uninstaller run in place and wait, so its exit code is the real one.
          $uninstall = Start-Process -FilePath $uninstallers[0].FullName -ArgumentList '/S', "_?=$installDir" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "The uninstaller ended with exit code $($uninstall.ExitCode)."
          }

      - name: Upload the installer
        env:
          OUTPUT_URL: ${{ inputs.output_url }}
          # The one installer of the release folder. The install step counted it and checked its name.
          INSTALLER_PATH: ${{ steps.install-app.outputs.installer-path }}
        run: |
          $installer = Get-Item -LiteralPath $env:INSTALLER_PATH
          # An operator compares this hash with desktop_builds.installer_sha256 (docs/v2/runbook.md).
          $installerSha256 = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash
          Write-Output "Installer $($installer.Name): $($installer.Length) bytes, SHA-256 $installerSha256"
          # The progress bar makes Invoke-WebRequest much slower.
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri $env:OUTPUT_URL -Method Put -InFile $installer.FullName -ContentType 'application/octet-stream' | Out-Null
