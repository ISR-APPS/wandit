autoInstallPeers: false
packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
  msw: true
  msgpackr-extract: true
  sharp: false
  workerd: false
  "@sentry/cli": true
  core-js: false
  protobufjs: false
catalog:
  dotenv: ^17.2.2
  # Sentry SDKs must stay in version lockstep — bump all five together.
  "@sentry/nestjs": 10.69.0
  "@sentry/node": 10.69.0
  "@sentry/react": 10.69.0
  "@sentry/cloudflare": 10.69.0
  "@sentry/vite-plugin": 5.4.0
  "@sentry/esbuild-plugin": 5.4.0
  posthog-js: 1.359.1
  posthog-node: 5.28.0
  zod: ^4.1.13
  typescript: ^6
  better-auth: 1.6.22
  lucide-react: ^1.21.0
  next-themes: ^0.4.6
  sonner: ^2.0.7
  "@tanstack/react-form": ^1.28.0
  "@types/react-dom": ^19.2.3
  tailwind-merge: ^3.6.0
  "@better-auth/expo": 1.6.22
